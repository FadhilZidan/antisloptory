name: Validate Anti-Slop Fiction

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate-markdown:
    name: Validate Markdown & Skill Frontmatter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax Check on Installer
        run: node --check scripts/installer.mjs

      - name: Validate SKILL Frontmatter Exists
        run: |
          for skill_file in skills/*/SKILL.md; do
            if [ -f "$skill_file" ]; then
              echo "Checking $skill_file..."
              head -n 1 "$skill_file" | grep -q "^---" || { echo "Missing YAML frontmatter in $skill_file"; exit 1; }
              grep -q "name:" "$skill_file" || { echo "Missing 'name:' field in $skill_file"; exit 1; }
              grep -q "description:" "$skill_file" || { echo "Missing 'description:' field in $skill_file"; exit 1; }
              echo "✓ $skill_file valid."
            fi
          done

      - name: Dry Run Installer Script
        run: node scripts/installer.mjs --dry-run
